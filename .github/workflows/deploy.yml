name: Deploy

on:
  push:
    branches: [main]

# Only run after CI passes
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Push images & update ECS
    runs-on: ubuntu-latest
    # Uncomment when AWS credentials are configured in repository secrets.
    # environment: production
    if: false  # Remove this line when ready to deploy to AWS in Phase 3

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-west-2

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in api router worker metrics; do
            docker build \
              --file services/$service/Dockerfile \
              --tag $ECR_REGISTRY/inferroute-$service:$IMAGE_TAG \
              .
            docker push $ECR_REGISTRY/inferroute-$service:$IMAGE_TAG
          done

      - name: Update ECS services
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in api router worker; do
            aws ecs update-service \
              --cluster inferroute-prod \
              --service inferroute-$service \
              --force-new-deployment
          done
