global:
  scrape_interval: 15s

scrape_configs:
  - job_name: inferroute-api
    static_configs:
      - targets: ['api:8080']

  - job_name: inferroute-metrics
    static_configs:
      - targets: ['metrics:9100']

  - job_name: inferroute-workers
    static_configs:
      - targets: ['worker-a:9001', 'worker-b:9002', 'worker-c:9003']
    metrics_path: /metrics
